name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sois
          POSTGRES_PASSWORD: sois
          POSTGRES_DB: sois
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U sois -d sois"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present
      - name: Prisma generate + migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://sois:sois@localhost:5432/sois?schema=public
          REDIS_URL: redis://redis:6379
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed || echo "seed skipped"
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Health check (start + curl)
        env:
          DATABASE_URL: postgresql://sois:sois@localhost:5432/sois?schema=public
          REDIS_URL: redis://redis:6379
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          PORT: 3001
        run: |
          node backend/dist/src/main &
          for i in $(seq 1 15); do curl -fs http://localhost:3001/api/v1/health && break || sleep 2; done
          curl -fs http://localhost:3001/api/v1/health | grep -q '"status":"ok"'

  frontend-trainee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-trainee/package-lock.json
      - run: npm ci
        working-directory: frontend-trainee
      - run: npm run build
        working-directory: frontend-trainee

  frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
        working-directory: frontend-admin
      - run: npm run build
        working-directory: frontend-admin

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config
      - name: Build images
        run: docker compose build
