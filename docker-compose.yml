version: "3.9"

# SOIS — Full-stack local / demo stack
# Owned by: Member 6 (Architecture & Research) — M6-01/02
# 5 services: postgres + redis + backend + fe-trainee + fe-admin
services:
  postgres:
    image: postgres:16
    container_name: sois-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sois
      POSTGRES_PASSWORD: sois
      POSTGRES_DB: sois
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sois -d sois"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sois-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sois-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sois:sois@postgres:5432/sois?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 30
    ports:
      - "3001:3001"
    # M6-02: prod entrypoint — migrate deploy + seed + start:prod (was npm run start:dev)
    command: sh -c "npx prisma migrate deploy && npx prisma db seed || true && npm run start:prod"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  fe-trainee:
    build:
      context: ./frontend-trainee
      dockerfile: Dockerfile
    container_name: sois-fe-trainee
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

  fe-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: sois-fe-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  redis_data:
